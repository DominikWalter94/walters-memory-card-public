name: Synchronize public collection
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - '.github/workflows/sync.yml'
  schedule:
    - cron: '17,47 * * * *'
permissions:
  contents: write
concurrency:
  group: public-collection
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate public database export
        run: node scripts/sync.mjs
      - name: Publish validated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add collection.json sync-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize public collection and verification date"
            git push
          fi
